# ============================================================
# 珠宝海报生成器 - Nginx 站点配置
# 使用方式：
#   1) 把 YOUR_DOMAIN 换成你的域名
#   2) 前端构建产物 dist 的路径按实际部署位置修改
#   3) 在宝塔面板：网站 → 对应站点 → 配置文件，替换为下面内容；
#      或直接写入 /www/server/panel/vhost/nginx/你的域名.conf
#   4) 改完后执行  nginx -t  &&  nginx -s reload
# ============================================================

server {
    listen 80;
    server_name YOUR_DOMAIN;            # ← 改成你的域名（SSL 配置后会自动改 443）

    # 前端构建产物目录（vite build 生成的 dist）
    root /www/wwwroot/haibao/frontend/dist;
    index index.html;

    # 允许大文件上传（海报/AI 生成图较大，10MB 限制）
    client_max_body_size 100m;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # ---- 前端 SPA 路由：所有找不到的路径都交给 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API 反向代理（后端监听 127.0.0.1:3001，不对外暴露）----
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 令牌由服务端注入，浏览器/前端代码不接触 AUTH_TOKEN；片段由 deploy.sh 生成（600 权限）
        include /www/wwwroot/haibao/deploy/nginx-auth.conf;
        # AI 生成最长 120~180s，必须加大超时，否则生成到一半被掐断
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 上传/生成的图片、Logo 静态文件（由后端 serve）----
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # ---- 图片等静态资源缓存（海报/Logo）----
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 安全：禁止直接访问源码、配置和数据文件 ----
    location ~* ^/(backend|database|data|deploy)/ {
        deny all;
        return 403;
    }
    location ~* \.(env|env\.example|json|log|sh|conf)$ {
        deny all;
        return 403;
    }
}

# 说明：
# 0) /api/ 的认证令牌不由前端携带，而是 include deploy/nginx-auth.conf
#    （deploy.sh 生成，内容为 proxy_set_header Authorization "Bearer ..."），
#    该片段位于 /deploy/ 下，已被上面的 deny 规则禁止从公网访问。
# 1) 前端通过同一域名下的 /api 请求后端（vite.config 里 baseURL 就是 /api），
#    同源访问，无需再改后端 CORS（后端 CORS 只放行 localhost:5173，不影响生产）。
# 2) 后端 app.js 里 app.listen(PORT, '127.0.0.1') 只监听本机，
#    外网无法直接访问 3001，必须走这个反向代理，安全性好，不用开 3001 端口。
# 3) 配置 HTTPS 后（宝塔一键 SSL），此配置会自动包一层 443 server。
